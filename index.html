<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>长征绘途 - 序幕：瑞金出发</title>
    <style>
        /* 引入像素风复古字体（如没有则回退单字宽字体） */
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+Courier+New&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #121216;
            color: #e2dcd0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 游戏主容器 - 模拟复古独立游戏的分辨率 */
        #game-container {
            position: relative;
            width: 800px;
            height: 500px;
            background-color: #1a1a24;
            border: 4px solid #3a3a4a;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            display: flex;
            overflow: hidden;
        }

        /* 左侧：剧情与舞台区 */
        .stage-area {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            border-right: 4px solid #3a3a4a;
            background: linear-gradient(180deg, #181820 0%, #101014 100%);
        }

        /* 游戏主画面画布 */
        #view-canvas {
            width: 100%;
            height: 340px;
            background-color: #0d0d13;
            /* 核心：保证像素风美术不模糊 */
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* 剧情旁白字幕区 */
        .narrative-box {
            flex: 1;
            padding: 16px;
            background-color: #161622;
            font-size: 14px;
            line-height: 1.6;
            color: #c2b9a7;
            border-top: 2px solid #2a2a3a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .narrative-text {
            min-height: 60px;
        }

        /* 右侧：工作台（手绘交互区） */
        .sketch-panel {
            width: 280px;
            background-color: #22222e;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            justify-content: space-between;
        }

        .panel-title {
            font-size: 14px;
            color: #e6a15c;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-align: center;
        }

        /* 玩家手绘区域容器 */
        .canvas-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            border: 4px solid #4d4d66;
            background-color: #181824;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        /* 实际绘图Canvas，通过CSS放大实现像素颗粒感 */
        #paint-canvas {
            width: 100%;
            height: 100%;
            cursor: crosshair;
            image-rendering: pixelated;
        }

        /* 调色盘与工具 */
        .tools-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }

        .palette {
            display: flex;
            gap: 8px;
        }

        .color-dot {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: 2px solid #3a3a4a;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .color-dot.active {
            border-color: #ffffff;
            transform: scale(1.15);
        }

        /* 复古像素像素风按钮 */
        .pixel-btn {
            background-color: #a33835;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: -3px 0 0 #5a1e1c, 3px 0 0 #5a1e1c, 0 -3px 0 #5a1e1c, 0 3px 0 #5a1e1c;
            margin: 5px;
        }

        .pixel-btn:hover {
            background-color: #bc4340;
        }

        .pixel-btn:active {
            transform: translate(1px, 1px);
        }

        .pixel-btn:disabled {
            background-color: #4a4a5a;
            box-shadow: -3px 0 0 #2a2a34, 3px 0 0 #2a2a34, 0 -3px 0 #2a2a34, 0 3px 0 #2a2a34;
            color: #8a8a9a;
            cursor: not-allowed;
        }

        #next-btn {
            background-color: #437a43;
            box-shadow: -3px 0 0 #234723, 3px 0 0 #234723, 0 -3px 0 #234723, 0 3px 0 #234723;
        }
        #next-btn:hover { background-color: #529452; }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="stage-area">
            <canvas id="view-canvas" width="320" height="220"></canvas>
            <div class="narrative-box">
                <div class="narrative-text" id="typer-text">正在加载苏区回忆...</div>
                <div style="text-align: right;">
                    <button class="pixel-btn" id="next-btn" style="display: none;">解锁下一路线</button>
                </div>
            </div>
        </div>

        <div class="sketch-panel">
            <div>
                <div class="panel-title">【绘制：煤油灯芯】</div>
                <div class="canvas-wrapper">
                    <canvas id="paint-canvas" width="64" height="64"></canvas>
                </div>
            </div>

            <div class="tools-area">
                <div class="palette">
                    <div class="color-dot active" style="background-color: #e6a15c;" data-color="#e6a15c"></div> <div class="color-dot" style="background-color: #b85730;" data-color="#b85730"></div> <div class="color-dot" style="background-color: #3f2830;" data-color="#3f2830"></div> <div class="color-dot" style="background-color: #ffffff;" data-color="#ffffff"></div> </div>
                <div>
                    <button class="pixel-btn" id="clear-btn" style="background-color:#4a4a5a; box-shadow: -3px 0 0 #2a2a34, 3px 0 0 #2a2a34, 0 -3px 0 #2a2a34, 0 3px 0 #2a2a34;">擦除</button>
                    <button class="pixel-btn" id="submit-btn">注入灯芯</button>
                </div>
            </div>
        </div>
    </div>

<script>
    // --- 游戏状态控制 ---
    const state = {
        step: 0,
        isLightUp: false,
        textBuffer: "",
        textIndex: 0
    };

    // --- 剧情文本数据 ---
    const scriptText = [
        "1934年深秋，江西瑞金。\n你在一间老旧的指挥部里醒来，桌上摊开一张泛黄的军用地图。",
        "年轻的警卫员匆匆走来，将一盏熄灭的煤油灯推到你面前：\n“同志，灯芯烧完了……如果看不清地图，后面的路就全错了。”",
        "【系统提示：请在右侧画板为煤油灯绘制一截‘燃烧的灯芯’，完成后点击注入。】",
        "伴随火光亮起，温暖的像素微光驱散了指挥部的黑暗。\n地图上，赫然浮现出第一条红军前进路线：“战略转移·瑞金出发”！"
    ];

    // --- 初始化 Canvas ---
    const viewCanvas = document.getElementById('view-canvas');
    const ctxV = viewCanvas.getContext('2d');
    const paintCanvas = document.getElementById('paint-canvas');
    const ctxP = paintCanvas.getContext('2d');

    // 禁用平滑，确保像素风美术渲染硬边缘
    ctxV.imageSmoothingEnabled = false;
    ctxP.imageSmoothingEnabled = false;

    // --- 玩家绘画逻辑 (64x64 像素画布) ---
    let isDrawing = false;
    let currentColor = '#e6a15c';

    // 初始化画板背景
    ctxP.fillStyle = '#181824';
    ctxP.fillRect(0, 0, 64, 64);

    function getCanvasCoords(e, canvas) {
        const rect = canvas.getBoundingClientRect();
        // 映射回 Canvas 实际的像素分辨率（64x64）
        const x = Math.floor((e.clientX - rect.left) / rect.width * canvas.width);
        const y = Math.floor((e.clientY - rect.top) / rect.height * canvas.height);
        return { x, y };
    }

    paintCanvas.addEventListener('mousedown', (e) => {
        if(state.isLightUp) return; // 通关后禁止再画
        isDrawing = true;
        draw(e);
    });
    window.addEventListener('mouseup', () => isDrawing = false);
    paintCanvas.addEventListener('mousemove', draw);

    function draw(e) {
        if (!isDrawing) return;
        const { x, y } = getCanvasCoords(e, paintCanvas);
        ctxP.fillStyle = currentColor;
        // 每次点击或移动，填满一个像素点（2x2大小让线条更有存在感）
        ctxP.fillRect(x - 1, y - 1, 2, 2);
    }

    // 调色盘点击
    document.querySelectorAll('.color-dot').forEach(dot => {
        dot.addEventListener('click', (e) => {
            document.querySelector('.color-dot.active').classList.remove('active');
            e.target.classList.add('active');
            currentColor = e.target.dataset.color;
        });
    });

    // 清除画布
    document.getElementById('clear-btn').addEventListener('click', () => {
        if(state.isLightUp) return;
        ctxP.fillStyle = '#181824';
        ctxP.fillRect(0, 0, 64, 64);
    });

    // --- 打字机叙事效果 ---
    const typerTextEl = document.getElementById('typer-text');
    function startTyping(text) {
        state.textBuffer = text;
        state.textIndex = 0;
        typerTextEl.innerText = "";
        typeNextChar();
    }

    function typeNextChar() {
        if (state.textIndex < state.textBuffer.length) {
            typerTextEl.innerText += state.textBuffer.charAt(state.textIndex);
            state.textIndex++;
            setTimeout(typeNextChar, 40); // 逐字打字速度
        }
    }

    // --- 2D像素渲染引擎 (手绘场景代码生成) ---
    function drawScene() {
        ctxV.clearRect(0, 0, viewCanvas.width, viewCanvas.height);

        // 1. 绘制深夜指挥部背景 (暗色调像素色块)
        ctxV.fillStyle = '#14141e';
        ctxV.fillRect(0, 0, viewCanvas.width, viewCanvas.height);

        // 2. 绘制桌子与泛黄地图
        ctxV.fillStyle = '#3a251c'; // 桌子
        ctxV.fillRect(20, 160, 280, 60);
        ctxV.fillStyle = '#caba94'; // 地图基础色
        ctxV.fillRect(40, 170, 240, 40);

        // 地图细节纹理
        ctxV.fillStyle = '#b0a078';
        ctxV.fillRect(60, 180, 80, 4);
        ctxV.fillRect(160, 185, 90, 6);

        // 如果点亮了，在地图上绘制红色路线
        if (state.isLightUp) {
            ctxV.fillStyle = '#a33835';
            // 像素红军长征第一阶段路线
            ctxV.fillRect(60, 190, 40, 4);
            ctxV.fillRect(100, 185, 30, 4);
            ctxV.fillRect(130, 175, 50, 4);
            
            // 终点闪烁红旗（简易像素旗帜）
            ctxV.fillStyle = '#ffd700';
            ctxV.fillRect(180, 168, 2, 8);
            ctxV.fillStyle = '#a33835';
            ctxV.fillRect(182, 168, 6, 4);
        }

        // 3. 绘制复古煤油灯座 (经典马灯造型)
        const lampX = 140;
        const lampY = 110;
        
        ctxV.fillStyle = '#2b3a4a'; // 铁皮灯座底座
        ctxV.fillRect(lampX, lampY + 40, 40, 15);
        ctxV.fillRect(lampX + 5, lampY + 35, 30, 5);
        
        // 玻璃罩轮廓 (半透明或暗色)
        ctxV.fillStyle = state.isLightUp ? 'rgba(255, 230, 150, 0.2)' : 'rgba(40, 50, 70, 0.6)';
        ctxV.fillRect(lampX + 8, lampY, 24, 35);

        // 铁提手
        ctxV.strokeStyle = '#2b3a4a';
        ctxV.lineWidth = 2;
        ctxV.strokeRect(lampX + 4, lampY - 10, 32, 20);

        // 4. 【核心动态纹理转换机制】：将玩家手绘的 Canvas 作为贴图融合进场景
        if (state.isLightUp) {
            // 动态计算呼吸灯微颤效果，增加像素风的灵动感
            const wobble = Math.sin(Date.now() * 0.01) * 2;
            
            // 绘制环境像素环境光晕 (光圈扩散效果)
            const gradient = ctxV.createRadialGradient(lampX+20, lampY+18, 5, lampX+20, lampY+18, 70 + wobble);
            gradient.addColorStop(0, 'rgba(230, 161, 92, 0.5)');
            gradient.addColorStop(0.4, 'rgba(184, 87, 48, 0.2)');
            gradient.addColorStop(1, 'rgba(20, 20, 30, 0)');
            ctxV.fillStyle = gradient;
            ctxV.fillRect(0, 0, viewCanvas.width, viewCanvas.height);

            // 实时把玩家在右边画的 Canvas，贴到灯罩正中心！
            // 将 64x64 的手绘图压缩成 16x16 嵌入灯芯位置
            ctxV.drawImage(paintCanvas, lampX + 12, lampY + 10, 16, 16);
        } else {
            // 未点亮时，灯中央显示淡淡的虚线指引
            ctxV.fillStyle = '#3a3a4a';
            ctxV.fillRect(lampX + 18, lampY + 15, 4, 12);
        }

        requestAnimationFrame(drawScene);
    }

    // --- 游戏核心交互逻辑闭环 ---
    const submitBtn = document.getElementById('submit-btn');
    const nextBtn = document.getElementById('next-btn');

    // 触发第一阶段剧情
    startTyping(scriptText[0]);
    
    // 剧情推进计时器模拟警卫员走过来
    setTimeout(() => {
        startTyping(scriptText[1]);
        setTimeout(() => {
            startTyping(scriptText[2]);
        }, 5000);
    }, 5000);

    // 玩家提交手绘作品
    submitBtn.addEventListener('click', () => {
        if (state.isLightUp) return;

        // 触发纹理融合与环境点亮
        state.isLightUp = true;
        submitBtn.disabled = true;
        document.getElementById('clear-btn').disabled = true;

        // 切换到通关剧情
        startTyping(scriptText[3]);

        // 显示通关按钮，解锁下一关
        setTimeout(() => {
            nextBtn.style.display = 'inline-block';
        }, 3000);
    });

    nextBtn.addEventListener('click', () => {
        alert("🎉 第一关通关！下一关：【血战湘江·架设浮桥】即将解锁！");
    });

    // 启动渲染循环
    drawScene();

</script>
</body>
</html>
